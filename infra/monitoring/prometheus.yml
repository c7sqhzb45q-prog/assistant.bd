global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /health
    static_configs:
      - targets: ['api-gateway:3001']

  - job_name: workflow-engine
    metrics_path: /health
    static_configs:
      - targets: ['workflow-engine:3002']

  - job_name: ai-orchestrator
    metrics_path: /health
    static_configs:
      - targets: ['ai-orchestrator:3003']
