apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant-bd
  namespace: assistant-bd
spec:
  rules:
    - host: app.assistant.bd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
