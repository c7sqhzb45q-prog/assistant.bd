apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: assistant-bd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/c7sqhzb45q-prog/assistant.bd/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: assistant-bd-secrets
                  key: NEXT_PUBLIC_API_URL
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: assistant-bd
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
