apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: assistant-bd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/c7sqhzb45q-prog/assistant.bd/api-gateway:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: assistant-bd-config
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: assistant-bd-config
                  key: API_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assistant-bd-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: assistant-bd-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: assistant-bd-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: assistant-bd-secrets
                  key: STRIPE_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: assistant-bd
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3001
