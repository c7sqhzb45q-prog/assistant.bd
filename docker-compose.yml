version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: assistant_bd_postgres
    environment:
      POSTGRES_DB: assistant_bd
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - assistant_network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: assistant_bd_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - assistant_network

  # API Gateway (NestJS)
  api-gateway:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles:
      - app
    container_name: assistant_bd_api
    environment:
      DATABASE_URL: postgresql://admin:secure_password_change_me@postgres:5432/assistant_bd
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - assistant_network
    working_dir: /app/services/api-gateway
    command: npm run dev
    volumes:
      - ./services/api-gateway:/app/services/api-gateway
      - /app/services/api-gateway/node_modules

  # Workflow Engine
  workflow-engine:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        SERVICE_NAME: workflow-engine
    profiles:
      - app
    container_name: assistant_bd_workflow
    environment:
      DATABASE_URL: postgresql://admin:secure_password_change_me@postgres:5432/assistant_bd
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    networks:
      - assistant_network
    working_dir: /app/services/workflow-engine
    command: npm run dev
    volumes:
      - ./services/workflow-engine:/app/services/workflow-engine
      - /app/services/workflow-engine/node_modules

  # AI Orchestrator
  ai-orchestrator:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        SERVICE_NAME: ai-orchestrator
    profiles:
      - app
    container_name: assistant_bd_ai
    environment:
      DATABASE_URL: postgresql://admin:secure_password_change_me@postgres:5432/assistant_bd
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy}
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    networks:
      - assistant_network
    working_dir: /app/services/ai-orchestrator
    command: npm run dev
    volumes:
      - ./services/ai-orchestrator:/app/services/ai-orchestrator
      - /app/services/ai-orchestrator/node_modules

  # Next.js Web Dashboard
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles:
      - app
    container_name: assistant_bd_web
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:3001
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - assistant_network
    working_dir: /app/apps/web
    command: npm run dev
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

volumes:
  postgres_data:
  redis_data:

networks:
  assistant_network:
    driver: bridge
